<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email Domain Security</title>
<meta name="description" content="Analysez la sécurité et la réputation du domaine associé à une adresse email professionnelle." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234f8cff' d='M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#070b16;
    --bg-2:#0b1224;
    --panel:rgba(19,26,46,.78);
    --panel-solid:#101828;
    --line:#243050;
    --line-soft:#1b2440;
    --txt:#e9edf9;
    --muted:#8e9bbb;
    --accent:#4f8cff;
    --accent-2:#7c5cff;
    --low:#22c07a;
    --med:#f5a524;
    --high:#ef4444;
    --unknown:#8b95ad;
    --radius:16px;
    --shadow:0 18px 40px -22px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
  img,table{max-width:100%}
  body{
    background:
      radial-gradient(1100px 520px at 12% -8%, rgba(79,140,255,.16), transparent 60%),
      radial-gradient(900px 480px at 92% 0%, rgba(124,92,255,.14), transparent 58%),
      linear-gradient(180deg, var(--bg), var(--bg-2) 60%, var(--bg));
    color:var(--txt);
    font:15px/1.55 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .shell{max-width:1080px;margin:0 auto;padding:34px 18px 70px}
  a{color:var(--accent)}

  /* ------------------------------------------------------------ en-tête */
  .hero{display:flex;gap:16px;align-items:center;margin-bottom:8px}
  .shield{
    width:50px;height:50px;flex:0 0 auto;border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(145deg, rgba(79,140,255,.25), rgba(124,92,255,.18));
    border:1px solid rgba(79,140,255,.35);
    box-shadow:0 10px 26px -16px rgba(79,140,255,.9);
  }
  .shield svg{width:26px;height:26px}
  h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.4px}
  .subtitle{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch}
  .hero-block{margin-bottom:26px}

  /* ------------------------------------------------------------ cartes */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(6px);
  }
  .card + .card{margin-top:18px}
  .card h2{font-size:15px;margin:0 0 14px;letter-spacing:.2px}

  /* ------------------------------------------------------------ formulaire */
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=email]{
    flex:1 1 320px;min-width:0;
    background:#0a1020;border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:14px 16px;font-size:15px;outline:none;
    transition:border-color .18s, box-shadow .18s;
  }
  input[type=email]::placeholder{color:#63708f}
  input[type=email]:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,140,255,.14)}
  input[type=email].invalid{border-color:var(--high);box-shadow:0 0 0 4px rgba(239,68,68,.12)}
  button{
    font:inherit;cursor:pointer;border-radius:12px;border:1px solid transparent;
    padding:14px 22px;font-weight:600;transition:transform .12s, filter .18s, background .18s;
  }
  button:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;white-space:nowrap}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-primary[disabled]{opacity:.65;cursor:progress}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--txt);font-weight:500}
  .btn-ghost:hover{border-color:var(--accent)}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .spinner{
    display:inline-block;width:15px;height:15px;margin-right:9px;vertical-align:-2px;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .examples{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .examples .lbl{font-size:12.5px;color:var(--muted)}
  .chip{
    font:inherit;font-size:13px;color:var(--txt);background:#0d1526;
    border:1px solid var(--line-soft);border-radius:999px;padding:6px 13px;
  }
  .chip:hover{border-color:var(--accent);background:#111c33}

  .alert{margin-top:14px;padding:11px 14px;border-radius:11px;font-size:14px;display:none}
  .alert.show{display:block}
  .alert.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.42)}
  .alert.warn{background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.42)}
  .alert.ok{background:rgba(34,192,122,.1);border:1px solid rgba(34,192,122,.4)}
  .alert.info{background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.4)}

  /* ------------------------------------------------------------ progression */
  .progress{height:4px;border-radius:999px;background:#0d1526;overflow:hidden;margin-top:16px;display:none}
  .progress.show{display:block}
  .progress i{display:block;height:100%;width:38%;border-radius:999px;
    background:linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
    animation:slide 1.15s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

  .statusline{margin-top:12px;font-size:13.5px;color:var(--muted);display:none;align-items:center;gap:8px}
  .statusline.show{display:flex}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ------------------------------------------------------------ KPI */
  .kpis{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px}
  .kpi{background:linear-gradient(180deg, rgba(16,24,40,.9), rgba(13,21,38,.9));
       border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:10px}
  .kpi .v{font-size:24px;font-weight:700;letter-spacing:-.3px}
  .kpi .d{font-size:12.5px;color:var(--muted);margin-top:6px}
  .badge{display:inline-block;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.4px}
  .b-LOW{background:rgba(34,192,122,.15);color:var(--low);border:1px solid rgba(34,192,122,.5)}
  .b-MEDIUM{background:rgba(245,165,36,.15);color:var(--med);border:1px solid rgba(245,165,36,.5)}
  .b-HIGH{background:rgba(239,68,68,.15);color:var(--high);border:1px solid rgba(239,68,68,.5)}
  .b-UNKNOWN{background:rgba(139,149,173,.15);color:var(--unknown);border:1px solid rgba(139,149,173,.5)}
  .b-GOOD{background:rgba(34,192,122,.13);color:var(--low);border:1px solid rgba(34,192,122,.42)}
  .b-SUSPICIOUS{background:rgba(245,165,36,.13);color:var(--med);border:1px solid rgba(245,165,36,.42)}
  .b-MALICIOUS{background:rgba(239,68,68,.13);color:var(--high);border:1px solid rgba(239,68,68,.42)}

  .gauge{margin-top:16px}
  .bar{height:9px;border-radius:999px;background:#0a1020;border:1px solid var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .6s cubic-bezier(.3,.9,.3,1)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .legend b{color:var(--txt);font-weight:600}

  /* ------------------------------------------------------------ critères */
  ul.criteria{list-style:none;margin:0;padding:0}
  ul.criteria li{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;
    padding:11px 0;border-bottom:1px dashed var(--line-soft)}
  ul.criteria li:last-child{border-bottom:0}
  ul.criteria .impact{flex:0 0 auto;font-weight:700;color:var(--high)}
  ul.criteria .none{color:var(--low)}

  /* ------------------------------------------------------------ sections */
  .sections{display:grid;grid-template-columns:repeat(auto-fit, minmax(232px,1fr));gap:14px}
  .section{background:#0d1526;border:1px solid var(--line-soft);border-radius:13px;padding:15px}
  .section h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 12px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed rgba(36,48,80,.6)}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted);white-space:nowrap}
  .kv .v{text-align:right;word-break:break-word}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12.5px}
  .ok{color:var(--low)} .bad{color:var(--high)} .warnc{color:var(--med)} .dim{color:var(--muted)}

  /* ------------------------------------------------------------ sources */
  .sources{display:flex;gap:10px;flex-wrap:wrap}
  .source{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:7px 13px;border-radius:999px;
    background:#0d1526;border:1px solid var(--line-soft)}
  .source .s-ico{font-weight:700}
  .source.ok{border-color:rgba(34,192,122,.42)} .source.ok .s-ico{color:var(--low)}
  .source.error{border-color:rgba(239,68,68,.42)} .source.error .s-ico{color:var(--high)}
  .source.disabled{border-color:var(--line);color:var(--muted)} .source.disabled .s-ico{color:var(--muted)}

  .result-meta{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
  .result-meta .who{font-size:13px;color:var(--muted)}

  /* ------------------------------------------------------------ historique */
  .hist-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .search{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 260px}
  .search input{flex:1 1 200px;min-width:0;background:#0a1020;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 13px;font:inherit;font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
  tbody tr:hover{background:rgba(79,140,255,.05)}
  .dot-risk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .pag{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
  .hist-cards{display:none}
  .hcard{background:#0d1526;border:1px solid var(--line-soft);border-radius:12px;padding:14px}
  .hcard + .hcard{margin-top:10px}
  .hcard .top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
  .hcard .who{font-weight:600;word-break:break-all}
  .hcard .meta{font-size:12.5px;color:var(--muted)}
  .detail{margin-top:12px;padding:12px;border-radius:11px;background:#0a1020;border:1px solid var(--line-soft);display:none}
  .detail.show{display:block}
  .detail ul{margin:6px 0 0;padding-left:18px;font-size:13px}
  .detail li{margin:4px 0}

  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12.5px}

  /* ------------------------------------------------------------ responsive */
  @media (max-width: 860px){
    .kpis{grid-template-columns:repeat(3, 1fr)}
    h1{font-size:23px}
  }
  @media (max-width: 720px){
    .shell{padding:24px 14px 56px}
    .kpis{grid-template-columns:1fr 1fr}
    .kpi:last-child{grid-column:1 / -1}
    table.hist-table{display:none}
    .hist-cards{display:block}
    .card{padding:16px}
    .hero{align-items:flex-start}
  }
  @media (max-width: 480px){
    .kpis{grid-template-columns:1fr}
    h1{font-size:21px}
    .subtitle{font-size:13.5px}
    button{padding:13px 18px}
    .row > button{width:100%}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="hero-block">
    <div class="hero">
      <div class="shield" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.2 4.5 5.1v5.6c0 4.7 3.2 8.9 7.5 10.4 4.3-1.5 7.5-5.7 7.5-10.4V5.1L12 2.2Z" stroke="#7fb0ff" stroke-width="1.6"/><path d="m8.7 12.1 2.2 2.2 4.4-4.6" stroke="#22c07a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>Email Domain Security</h1>
        <p class="subtitle">Analysez la sécurité et la réputation du domaine associé à une adresse email professionnelle.</p>
      </div>
    </div>
  </div>

  <section class="card">
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Adresse email professionnelle</label>
        <div class="row">
          <input type="email" id="email" placeholder="Saisissez une adresse email professionnelle" autocomplete="off" spellcheck="false" />
          <button type="submit" class="btn-primary" id="submit">Analyser</button>
        </div>
      </div>
      <div class="examples">
        <span class="lbl">Exemples :</span>
        <button type="button" class="chip" data-email="contact@entreprise.com">contact@entreprise.com</button>
        <button type="button" class="chip" data-email="contact@google.com">contact@google.com</button>
        <button type="button" class="chip" data-email="test@yopmail.com">test@yopmail.com</button>
      </div>
      <div class="alert" id="alert" role="status" aria-live="polite"></div>
      <div class="progress" id="progress"><i></i></div>
      <div class="statusline" id="statusline"><span class="dot"></span><span id="statustext"></span></div>
    </form>
  </section>

  <div id="result"></div>

  <section class="card" id="history-card">
    <div class="hist-head">
      <h2 style="margin:0">Historique des analyses</h2>
      <div class="search">
        <input type="search" id="search" placeholder="Rechercher par domaine ou email" autocomplete="off" />
        <button type="button" class="btn-ghost btn-sm" id="refresh">Actualiser</button>
      </div>
    </div>
    <div id="history"></div>
  </section>

  <footer>Email Domain Security 1.0</footer>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('form');
  var emailInput = document.getElementById('email');
  var submitBtn = document.getElementById('submit');
  var alertBox = document.getElementById('alert');
  var progress = document.getElementById('progress');
  var statusline = document.getElementById('statusline');
  var statustext = document.getElementById('statustext');
  var resultEl = document.getElementById('result');
  var historyEl = document.getElementById('history');
  var searchInput = document.getElementById('search');

  var PAGE_SIZE = 10;
  var state = { offset: 0, total: 0, search: '', vtEnabled: false, loading: false };

  /* ------------------------------------------------------- utilitaires */
  function esc(value) {
    if (value === null || value === undefined) return '—';
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function showAlert(text, kind) {
    alertBox.className = 'alert show ' + (kind || 'info');
    alertBox.textContent = text;
  }
  function hideAlert() { alertBox.className = 'alert'; alertBox.textContent = ''; }
  function setBusy(busy, text) {
    state.loading = busy;
    submitBtn.disabled = busy;
    submitBtn.innerHTML = busy ? '<span class="spinner"></span>Analyse en cours…' : 'Analyser';
    progress.className = busy ? 'progress show' : 'progress';
    if (text) { statusline.className = 'statusline show'; statustext.textContent = text; }
    else { statusline.className = 'statusline'; statustext.textContent = ''; }
  }
  function setStatus(text) {
    statusline.className = text ? 'statusline show' : 'statusline';
    statustext.textContent = text || '';
  }
  function dt(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function riskColor(risk) {
    return { LOW: 'var(--low)', MEDIUM: 'var(--med)', HIGH: 'var(--high)' }[risk] || 'var(--unknown)';
  }
  var RISK_FR = { LOW: 'faible', MEDIUM: 'modéré', HIGH: 'élevé', UNKNOWN: 'indéterminé' };
  var REP_FR = { GOOD: 'bonne', SUSPICIOUS: 'suspecte', MALICIOUS: 'malveillante', UNKNOWN: 'indéterminée' };

  /* ------------------------------------------------------- formulaire */
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (state.loading) return;
    var value = emailInput.value.trim();
    if (!value) {
      emailInput.classList.add('invalid');
      showAlert('Saisissez une adresse email pour lancer l’analyse.', 'error');
      emailInput.focus();
      return;
    }
    if (!EMAIL_RE.test(value)) {
      emailInput.classList.add('invalid');
      showAlert('Cette adresse email n’est pas valide. Exemple attendu : contact@entreprise.com', 'error');
      emailInput.focus();
      return;
    }
    emailInput.classList.remove('invalid');
    analyze(value);
  });

  emailInput.addEventListener('input', function () {
    emailInput.classList.remove('invalid');
    if (alertBox.classList.contains('error')) hideAlert();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
    chip.addEventListener('click', function () {
      if (state.loading) return;
      emailInput.value = chip.getAttribute('data-email');
      emailInput.classList.remove('invalid');
      hideAlert();
      analyze(emailInput.value);
    });
  });

  /* ------------------------------------------------------- analyse */
  function analyze(email) {
    setBusy(true, 'Analyse en cours…');
    hideAlert();
    resultEl.innerHTML = '';
    var startedAt = Date.now();

    fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }).then(function (res) {
      return res.json().then(function (body) { return { status: res.status, body: body }; });
    }).then(function (out) {
      var seconds = ((Date.now() - startedAt) / 1000).toFixed(1);
      setBusy(false);
      setStatus('Analyse terminée en ' + seconds + ' s');

      var body = out.body || {};
      if (!body.ok) {
        if (body.code === 'INVALID_EMAIL') showAlert('Cette adresse email n’est pas valide. Exemple attendu : contact@entreprise.com', 'error');
        else if (body.code === 'DOMAIN_NOT_FOUND') showAlert('Impossible d’analyser ce domaine : il n’existe pas ou ne répond pas.', 'warn');
        else showAlert('L’analyse n’a pas pu aboutir. Vérifiez votre connexion puis réessayez.', 'error');
        return;
      }
      if (body.code === 'DOMAIN_NOT_FOUND') {
        showAlert('Impossible d’analyser ce domaine : il n’existe pas ou ne répond pas. L’analyse a malgré tout été enregistrée.', 'warn');
      } else if (body.saved === false) {
        showAlert('Analyse terminée, mais le résultat n’a pas pu être enregistré dans l’historique.', 'info');
      } else {
        hideAlert();
      }
      renderReport(body, seconds);
      loadHistory(0);
    }).catch(function () {
      setBusy(false);
      setStatus('');
      showAlert('Impossible de contacter le service d’analyse. Vérifiez votre connexion puis réessayez.', 'error');
    });
  }

  function sourceChip(label, statusValue) {
    var map = {
      ok: { cls: 'ok', ico: '✓', suffix: 'OK' },
      error: { cls: 'error', ico: '✕', suffix: 'indisponible' },
      disabled: { cls: 'disabled', ico: '—', suffix: 'désactivé' }
    };
    var info = map[statusValue] || map.disabled;
    return '<span class="source ' + info.cls + '"><span class="s-ico">' + info.ico + '</span>' +
      esc(label) + ' ' + info.suffix + '</span>';
  }

  function kv(key, value, cls) {
    return '<div class="kv"><span class="k">' + esc(key) + '</span><span class="v ' + (cls || '') + '">' + esc(value) + '</span></div>';
  }
  function yn(value, yes, no) {
    return value ? (yes || 'présent') : (no || 'absent');
  }

  function renderReport(body, seconds) {
    var r = body.report;
    var s = r.signals || {};
    var dns = s.dns || {};
    var rdap = s.rdap || {};
    var disposable = s.disposable || {};
    var urlscan = s.urlscan || {};
    var vt = s.virustotal || {};
    var score = (r.riskScore === null || r.riskScore === undefined) ? null : r.riskScore;
    var reasons = r.reasons || [];

    state.vtEnabled = Boolean(vt.enabled);

    var criteriaHtml = reasons.length
      ? '<ul class="criteria">' + reasons.map(function (item) {
          return '<li><span>' + esc(item.label) + '</span><span class="impact">' +
            (item.points > 0 ? '+' + item.points : '0') + '</span></li>';
        }).join('') + '</ul>'
      : '<p class="none ok">Aucun critère de risque détecté : tous les contrôles sont conformes.</p>';

    /* --- DNS --- */
    var dnsHtml =
      kv('MX', dns.error ? 'non disponible' : (dns.hasMx ? dns.mxCount + ' enregistrement(s)' + (dns.nullMx ? ' (dont null MX)' : '') : 'aucun'), dns.hasMx ? 'ok' : 'bad') +
      kv('SPF', dns.error ? 'non disponible' : (dns.spf || 'absent'), dns.spf ? 'ok' : 'bad') +
      kv('DMARC', dns.error ? 'non disponible' : (dns.hasDmarc ? 'p=' + (dns.dmarcPolicy || '?') : 'absent'), dns.hasDmarc ? 'ok' : 'bad') +
      kv('A', dns.error ? 'non disponible' : (dns.hasA ? (dns.ips || []).join(', ') : 'aucun'), 'mono') +
      kv('NS', dns.error ? 'non disponible' : yn(dns.hasNs, 'présents', 'aucun'));

    /* --- RDAP --- */
    var rdapHtml =
      kv('Âge du domaine', typeof rdap.ageDays === 'number' ? rdap.ageDays + ' jours' : 'inconnu') +
      kv('Créé le', rdap.createdAt ? dt(rdap.createdAt) : 'inconnu') +
      kv('Expire le', rdap.expiresAt ? dt(rdap.expiresAt) : 'inconnu') +
      kv('Registrar', rdap.registrar || 'inconnu');

    /* --- domaines jetables --- */
    var dispoHtml =
      kv('Résultat', disposable.listed === true ? 'domaine jetable connu' : (disposable.listed === false ? 'non répertorié' : 'indéterminé'), disposable.listed === true ? 'bad' : 'ok') +
      kv('Correspondance', disposable.matchedOn || '—', 'mono') +
      kv('Base consultée', disposable.source === 'blocklist' ? 'liste publique' : 'liste locale de secours') +
      kv('Taille de la liste', disposable.listSize ? disposable.listSize + ' domaines' : '—');

    /* --- urlscan --- */
    var urlscanHtml =
      kv('Analyses publiques', urlscan.error ? 'non disponible' : (urlscan.total || 0)) +
      kv('Dernière analyse', urlscan.lastScan ? dt(urlscan.lastScan) : '—') +
      kv('Verdicts malveillants', urlscan.error ? '—' : (urlscan.maliciousScans || 0), urlscan.maliciousScans ? 'bad' : 'ok');

    /* --- VirusTotal --- */
    var vtHtml;
    if (!vt.enabled) {
      vtHtml = kv('État', 'désactivé (source optionnelle)') +
               kv('Détections', '—');
    } else if (vt.error) {
      vtHtml = kv('État', 'indisponible', 'bad') + kv('Détections', '—');
    } else if (vt.found === false) {
      vtHtml = kv('État', 'domaine non référencé') + kv('Détections', '—');
    } else {
      vtHtml = kv('Moteurs malveillants', vt.malicious || 0, vt.malicious ? 'bad' : 'ok') +
               kv('Moteurs suspicieux', vt.suspicious || 0, vt.suspicious ? 'warnc' : 'ok') +
               kv('Moteurs inoffensifs', vt.harmless || 0) +
               kv('Catégories', (vt.categories || []).length ? (vt.categories || []).join(', ') : '—');
    }

    var savedText = body.saved
      ? 'Analyse enregistrée dans l’historique.'
      : 'Analyse non enregistrée dans l’historique.';

    resultEl.innerHTML =
      '<section class="card">' +
        '<div class="kpis">' +
          '<div class="kpi"><div class="k">Risque</div><div class="v"><span class="badge b-' + esc(r.risk) + '">' + esc(r.risk) + '</span></div>' +
            '<div class="d">Niveau ' + esc(RISK_FR[r.risk] || '') + '</div></div>' +
          '<div class="kpi"><div class="k">Réputation</div><div class="v"><span class="badge b-' + esc(r.reputation) + '">' + esc(r.reputation) + '</span></div>' +
            '<div class="d">Réputation ' + esc(REP_FR[r.reputation] || '') + '</div></div>' +
          '<div class="kpi"><div class="k">Score</div><div class="v">' + (score === null ? '—' : score + '<span class="dim" style="font-size:15px;font-weight:500">/100</span>') + '</div>' +
            '<div class="d">' + (score === null ? 'non calculable pour ce domaine' : 'Score de risque cumulé') + '</div></div>' +
        '</div>' +
        '<div class="gauge">' +
          '<div class="bar"><i style="width:' + (score === null ? 0 : score) + '%;background:' + riskColor(r.risk) + '"></i></div>' +
          '<div class="legend"><span>Score de risque : <b>' + (score === null ? '—' : score + '/100') + '</b></span>' +
            '<span><b>LOW</b> 0–24</span><span><b>MEDIUM</b> 25–59</span><span><b>HIGH</b> 60–100</span></div>' +
        '</div>' +
        '<div class="result-meta">' +
          '<div class="who">' + esc(r.email) + ' · domaine analysé : <b>' + esc(r.domain) + '</b><br>' +
            esc(savedText) + ' · vérifié le ' + esc(dt(r.checkedAt)) + '</div>' +
          '<button type="button" class="btn-ghost btn-sm" id="new-analysis">Nouvelle analyse</button>' +
        '</div>' +
      '</section>' +

      '<section class="card">' +
        '<h2>Critères déclenchés</h2>' + criteriaHtml +
      '</section>' +

      '<section class="card">' +
        '<h2>Informations collectées</h2>' +
        '<div class="sections">' +
          '<div class="section"><h3>DNS</h3>' + dnsHtml + '</div>' +
          '<div class="section"><h3>RDAP</h3>' + rdapHtml + '</div>' +
          '<div class="section"><h3>Domaines jetables</h3>' + dispoHtml + '</div>' +
          '<div class="section"><h3>urlscan.io</h3>' + urlscanHtml + '</div>' +
          '<div class="section"><h3>VirusTotal</h3>' + vtHtml + '</div>' +
        '</div>' +
        '<h3 style="margin:20px 0 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)">État des sources</h3>' +
        '<div class="sources">' +
          sourceChip('DNS', r.sources.dns) +
          sourceChip('RDAP', r.sources.rdap) +
          sourceChip('Blocklist', r.sources.blocklist) +
          sourceChip('urlscan.io', r.sources.urlscan) +
          sourceChip('VirusTotal', r.sources.virustotal) +
        '</div>' +
      '</section>';

    var newBtn = document.getElementById('new-analysis');
    if (newBtn) {
      newBtn.addEventListener('click', function () {
        emailInput.value = '';
        resultEl.innerHTML = '';
        hideAlert();
        setStatus('');
        emailInput.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  }

  /* ------------------------------------------------------- historique */
  function loadHistory(offset) {
    state.offset = offset || 0;
    historyEl.innerHTML = '<p class="dim">Chargement de l’historique…</p>';
    var url = '/api/history?limit=' + PAGE_SIZE + '&offset=' + state.offset +
      (state.search ? '&q=' + encodeURIComponent(state.search) : '');

    fetch(url).then(function (res) { return res.json(); }).then(function (out) {
      if (!out.configured) {
        historyEl.innerHTML = '<p class="dim">L’historique n’est pas disponible pour le moment.</p>';
        return;
      }
      if (!out.ok) {
        historyEl.innerHTML = '<p class="dim">L’historique est momentanément indisponible.</p>';
        return;
      }
      state.total = out.total || 0;
      if (!out.rows.length) {
        historyEl.innerHTML = '<p class="dim">' + (state.search ? 'Aucune analyse ne correspond à cette recherche.' : 'Aucune analyse enregistrée pour le moment.') + '</p>';
        return;
      }
      renderHistory(out);
    }).catch(function () {
      historyEl.innerHTML = '<p class="dim">L’historique est momentanément indisponible.</p>';
    });
  }

  function riskDot(risk) {
    return '<span class="dot-risk" style="background:' + riskColor(risk) + '"></span>' + esc(risk);
  }

  function renderHistory(out) {
    var rows = out.rows;
    var from = state.total ? state.offset + 1 : 0;
    var to = Math.min(state.offset + rows.length, state.total);

    var tableRows = rows.map(function (row, index) {
      return '<tr>' +
        '<td>' + esc(dt(row.created_at)) + '</td>' +
        '<td>' + esc(row.email) + '</td>' +
        '<td><b>' + esc(row.domain) + '</b></td>' +
        '<td>' + esc(row.reputation) + '</td>' +
        '<td>' + riskDot(row.risk) + '</td>' +
        '<td>' + esc(row.risk_score === null || row.risk_score === undefined ? '—' : row.risk_score) + '</td>' +
        '<td><button type="button" class="btn-ghost btn-sm" data-detail="' + index + '">Détail</button></td>' +
      '</tr>';
    }).join('');

    var cards = rows.map(function (row, index) {
      return '<div class="hcard">' +
        '<div class="top"><span class="who">' + esc(row.domain) + '</span><span class="badge b-' + esc(row.risk) + '">' + esc(row.risk) + '</span></div>' +
        '<div class="meta">' + esc(row.email) + ' · ' + esc(dt(row.created_at)) + ' · réputation ' + esc(row.reputation) +
          ' · score ' + esc(row.risk_score === null || row.risk_score === undefined ? '—' : row.risk_score) + '</div>' +
        '<div style="margin-top:10px"><button type="button" class="btn-ghost btn-sm" data-detail="' + index + '">Détail</button></div>' +
      '</div>';
    }).join('');

    historyEl.innerHTML =
      '<div style="overflow-x:auto">' +
        '<table class="hist-table"><thead><tr>' +
          '<th>Date</th><th>Email</th><th>Domaine</th><th>Réputation</th><th>Risque</th><th>Score</th><th></th>' +
        '</tr></thead><tbody>' + tableRows + '</tbody></table>' +
      '</div>' +
      '<div class="hist-cards">' + cards + '</div>' +
      '<div class="detail" id="detail-panel"></div>' +
      '<div class="pag">' +
        '<span>' + (state.total ? 'Analyses ' + from + ' à ' + to + ' sur ' + state.total : 'Aucun résultat') + '</span>' +
        '<span>' +
          '<button type="button" class="btn-ghost btn-sm" id="prev"' + (state.offset <= 0 ? ' disabled' : '') + '>Précédent</button> ' +
          '<button type="button" class="btn-ghost btn-sm" id="next"' + (state.offset + rows.length >= state.total ? ' disabled' : '') + '>Suivant</button>' +
        '</span>' +
      '</div>';

    var prev = document.getElementById('prev');
    var next = document.getElementById('next');
    if (prev) prev.addEventListener('click', function () { loadHistory(Math.max(0, state.offset - PAGE_SIZE)); });
    if (next) next.addEventListener('click', function () { loadHistory(state.offset + PAGE_SIZE); });

    Array.prototype.forEach.call(historyEl.querySelectorAll('[data-detail]'), function (button) {
      button.addEventListener('click', function () {
        var row = rows[parseInt(button.getAttribute('data-detail'), 10)];
        var panel = document.getElementById('detail-panel');
        var reasons = row.reasons || [];
        var sources = row.sources || [];
        var criteria = reasons.length
          ? '<ul>' + reasons.map(function (item) {
              return '<li>' + esc(item.label) + ' <b>+' + esc(item.points) + '</b></li>';
            }).join('') + '</ul>'
          : '<p class="dim" style="margin:6px 0 0">Aucun critère de risque détecté.</p>';
        panel.innerHTML = '<b>Détail de l’analyse</b><br>' +
          '<span class="dim">' + esc(row.email) + ' · ' + esc(row.domain) + ' · ' + esc(dt(row.created_at)) +
          ' · durée ' + esc(row.duration_ms === null || row.duration_ms === undefined ? '—' : row.duration_ms + ' ms') + '</span>' +
          criteria +
          '<div class="dim" style="margin-top:10px">Sources sollicitées : ' + esc(sources.length ? sources.join(', ') : '—') + '</div>';
        panel.className = 'detail show';
      });
    });
  }

  var debounce;
  searchInput.addEventListener('input', function () {
    clearTimeout(debounce);
    debounce = setTimeout(function () {
      state.search = searchInput.value.trim();
      loadHistory(0);
    }, 400);
  });
  document.getElementById('refresh').addEventListener('click', function () { loadHistory(state.offset); });

  /* ------------------------------------------------------- démarrage */
  fetch('/api/analyze').then(function (res) { return res.json(); }).then(function (info) {
    if (!info || !info.ok) return;
    state.vtEnabled = Boolean(info.virustotal_enabled);
  }).catch(function () {});

  loadHistory(0);

  // Lien direct : /#email=contact@entreprise.com lance l'analyse au chargement.
  var direct = /^email=(.+)$/.exec(decodeURIComponent((window.location.hash || '').replace(/^#/, '')));
  if (direct && EMAIL_RE.test(direct[1].trim())) {
    emailInput.value = direct[1].trim();
    analyze(emailInput.value);
  }
})();
</script>
</body>
</html>
